<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
<title>Duel — Speed Boggle</title>
<meta name="theme-color" content="#123524">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Firebase config + room helpers now live in shared.js, one repo-wide place.
     See shared.js for the Firebase Console setup steps and Firestore rule. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
// Registers the network-first service worker (sw.js) so updates deploy
// instantly instead of getting stuck behind a stale cached version on
// the home-screen icon. Same pattern as the Focus app.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js');
  });
}
</script>

<style>
  :root{
    --felt: #123524;
    --felt-deep: #0c2419;
    --felt-light: #1d4a34;
    --ivory: #f4ecd8;
    --ivory-dim: #e3d7b4;
    --ink: #22201c;
    --brass: #c9a227;
    --brass-bright: #e6c04f;
    --brass-dark: #8f6f16;
    --alert: #c1440e;
    --success: #7a9b5c;
    --line: rgba(244,236,216,0.14);
    --shadow-hard: 0 6px 0 rgba(0,0,0,0.35);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    min-height:100%; margin:0; overscroll-behavior:none;
    background: radial-gradient(120% 140% at 50% -10%, var(--felt-light), var(--felt) 55%, var(--felt-deep) 100%);
    color:var(--ivory);
    font-family:'Work Sans', sans-serif;
    -webkit-user-select:none; user-select:none;
  }
  #app{ min-height:100dvh; display:flex; flex-direction:column; padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)); }

  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:700; margin:0; letter-spacing:-0.01em; }

  .screen{ flex:1; display:flex; flex-direction:column; animation: fadein .35s ease both; }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .brand{ text-align:center; margin: 10px 0 28px; }
  .back-link{ display:inline-block; font-size:13px; color:var(--ivory-dim); text-decoration:none; margin-bottom:4px; }
  .back-link:active{ color:var(--brass-bright); }
  .stop-btn{ display:inline-block; font-size:13px; color:var(--alert); background:none; border:none; padding:0; font-family:'Work Sans'; cursor:pointer; margin-bottom:4px; }
  .stop-btn:active{ opacity:.7; }
  .brand .kicker{ display:block; font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--brass-bright); opacity:.85; margin-bottom:6px; }
  .brand h1{ font-size:40px; line-height:1; }
  .brand h1 .vs{ color:var(--brass-bright); font-style:italic; font-weight:600; }

  label{ font-size:12px; text-transform:uppercase; letter-spacing:.12em; color:var(--ivory-dim); display:block; margin: 18px 0 8px; }
  input[type=text], input[type=number]{
    width:100%; padding:14px 16px; font-size:18px; font-family:'Work Sans';
    background:var(--felt-light); border:1px solid var(--line); border-radius:10px;
    color:var(--ivory); outline:none;
  }
  input:focus{ border-color:var(--brass); }

  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:15px 20px; border-radius:12px; border:none; cursor:pointer;
    font-family:'Work Sans'; font-weight:600; font-size:16px; letter-spacing:.01em;
    transition: transform .08s ease;
  }
  .btn:active{ transform: translateY(2px); }
  .btn-primary{ background:var(--brass); color:#241c02; box-shadow:var(--shadow-hard); }
  .btn-primary:active{ box-shadow:0 3px 0 rgba(0,0,0,.35); }
  .btn-ghost{ background:transparent; color:var(--ivory-dim); border:1px solid var(--line); }
  .btn-row{ display:flex; gap:10px; margin-top:22px; }
  .btn-row .btn{ flex:1; }

  .card{ background:rgba(0,0,0,0.16); border:1px solid var(--line); border-radius:16px; padding:20px; margin-top:16px; }
  .muted{ color:var(--ivory-dim); font-size:14px; line-height:1.5; }
  .center{ text-align:center; }

  .code-display{
    font-family:'Fraunces'; font-weight:700; font-size:34px; letter-spacing:.12em;
    text-align:center; padding:16px; background:rgba(0,0,0,0.2); border-radius:12px;
    border:1px dashed var(--brass); color:var(--brass-bright); margin-top:10px;
  }

  .spinner{ width:16px; height:16px; border-radius:50%; border:2px solid rgba(244,236,216,.25); border-top-color:var(--brass-bright); animation:spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---- top bar during game ---- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .timer-ring{ position:relative; width:58px; height:58px; }
  .timer-ring svg{ transform:rotate(-90deg); width:58px; height:58px; }
  .timer-ring circle{ fill:none; stroke-width:5; }
  .timer-ring .bg{ stroke:rgba(244,236,216,.14); }
  .timer-ring .fg{ stroke:var(--brass-bright); stroke-linecap:round; transition:stroke-dashoffset .25s linear, stroke .3s ease; }
  .timer-ring.urgent .fg{ stroke:var(--alert); }
  .timer-num{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; font-family:'Fraunces'; }

  .opp-status{ text-align:right; }
  .opp-status .name{ font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--ivory-dim); }
  .opp-status .count{ font-family:'Fraunces'; font-size:22px; font-weight:700; color:var(--brass-bright); }

  /* ---- word tray ---- */
  .tray{
    position:relative;
    min-height:52px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:10px 14px; background:rgba(0,0,0,.18); border-radius:12px; margin-bottom:14px;
    border:1px solid var(--line);
  }
  .tray .current{ font-family:'Fraunces'; font-size:22px; font-weight:700; letter-spacing:.04em; }
  .tray.flash-good{ animation:flashgood .4s ease; }
  .tray.flash-bad{ animation:flashbad .4s ease; }
  @keyframes flashgood{ 0%{ background:rgba(122,155,92,.35);} 100%{ background:rgba(0,0,0,.18);} }
  @keyframes flashbad{ 0%{ background:rgba(193,68,14,.35);} 100%{ background:rgba(0,0,0,.18);} }

  .score-pop{
    position:absolute; right:14px; top:6px; font-family:'Fraunces'; font-weight:700;
    font-size:18px; color:var(--brass-bright); pointer-events:none;
    animation: scorepop .7s ease forwards;
  }
  @keyframes scorepop{
    0%{ opacity:0; transform:translateY(0) scale(.8); }
    20%{ opacity:1; transform:translateY(-4px) scale(1.15); }
    100%{ opacity:0; transform:translateY(-26px) scale(1); }
  }

  .found-count{ margin-left:auto; font-size:12px; color:var(--ivory-dim); }

  /* ---- grid ---- */
  .board-wrap{ flex:1; display:flex; align-items:center; justify-content:center; }
  .board{
    display:grid; gap:10px; width:100%; max-width:420px; aspect-ratio:1/1;
    touch-action:none; position:relative;
  }
  .tile{
    position:relative; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg, var(--ivory), var(--ivory-dim));
    border-radius:14px; box-shadow:0 4px 0 #b6a875, inset 0 1px 0 rgba(255,255,255,.6);
    font-family:'Fraunces'; font-weight:700; font-size:clamp(22px,7vw,34px); color:var(--ink);
    opacity:0; transform:scale(.3) rotate3d(1,1,0,60deg);
    animation: tumble-in .55s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  .tile.selected{ background:linear-gradient(180deg, var(--brass-bright), var(--brass)); box-shadow:0 4px 0 var(--brass-dark), inset 0 1px 0 rgba(255,255,255,.5); transform:scale(1.06); }
  .tile .qu-sub{ position:absolute; bottom:6px; right:8px; font-size:.4em; opacity:.65; }
  @keyframes tumble-in{ to{ opacity:1; transform:scale(1) rotate3d(0,0,1,0deg); } }

  .path-svg{ position:absolute; inset:0; pointer-events:none; }
  .path-svg path{ stroke:var(--brass-bright); stroke-width:5; fill:none; stroke-linecap:round; opacity:.55; }

  /* ---- results ---- */
  .result-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px; }
  .result-col h3{ font-size:15px; margin-bottom:8px; }
  .result-col .score{ font-family:'Fraunces'; font-size:30px; color:var(--brass-bright); }
  .wordline{ font-size:13px; padding:4px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; }
  .wordline .pt{ color:var(--brass-bright); }
  .removed-list{ font-size:12px; color:var(--ivory-dim); margin-top:6px; line-height:1.6; }
  .winner-banner{ text-align:center; margin:18px 0 6px; }
  .winner-banner h2{ font-size:28px; color:var(--brass-bright); }

  .toast{
    position:fixed; left:20px; right:20px; bottom:max(20px, env(safe-area-inset-bottom));
    background:var(--felt-light); border:1px solid var(--brass); border-radius:12px;
    padding:14px 16px; font-size:14px; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.4);
    transform:translateY(calc(100% + 60px)); transition:transform .3s ease; z-index:50;
  }
  .toast.show{ transform:translateY(0); }

  .hidden{ display:none !important; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
const db = Duel.db; // shared Firebase connection from shared.js

/* ============================================================
   THE 16 OFFICIAL BOGGLE DICE
   Real Boggle doesn't use flat-random letters — it rolls 16
   physical dice, each with 6 fixed letters, once per die.
   This keeps the letter distribution authentic (right amount
   of vowels, no impossible boards).
   Die #15 has a "Qu" face — in Boggle, Q always appears as "Qu".
   ============================================================ */
const BOGGLE_DICE = [
  "AAEEGN","ABBJOO","ACHOPS","AFFKPS","AOOTTW","CIMOTU",
  "DEILRX","DELRVY","DISTTY","EEGHNW","EEINSU","EHRTVW",
  "EIOSST","ELRTTY","HIMNQU","HLNNRZ"
];

const MIN_WORD_LEN = 3;
const ROUND_SECONDS_DEFAULT = 120;

function scoreForLength(len){
  if(len <= 4) return 1;
  if(len === 5) return 2;
  if(len === 6) return 3;
  if(len === 7) return 5;
  return 11;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* Rolls a fresh 16-letter board and returns it as a flat array
   of tile strings (each tile is "A".."Z" or "QU"). */
function rollBoard(){
  const dice = shuffle(BOGGLE_DICE);
  return dice.map(die => {
    const face = die[Math.floor(Math.random()*die.length)];
    return face === "Q" ? "QU" : face;
  });
}

/* ============================================================
   APP STATE
   ============================================================ */
let state = {
  screen: 'home',
  roomId: null,
  playerId: null,     // 'p1' or 'p2'
  playerName: null,
  room: null,          // live Firestore room doc
  unsub: null,
  boardSize: 4,
  currentPath: [],      // array of tile indices selected this drag
  foundWords: new Set(),
  score: 0,
  dragging: false,
  timerInterval: null,
  scoringDone: false,
  localMode: false
};

const toast = Duel.toast; // thin alias so existing calls below don't need renaming

/* ============================================================
   RENDER — a tiny hand-rolled router, one function per screen
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  if(state.screen === 'home') app.innerHTML = renderHome();
  else if(state.screen === 'lobby') app.innerHTML = renderLobby();
  else if(state.screen === 'countdown') app.innerHTML = renderCountdown();
  else if(state.screen === 'playing') app.innerHTML = renderPlaying();
  else if(state.screen === 'scoring') app.innerHTML = renderScoring();
  else if(state.screen === 'results') app.innerHTML = renderResults();
  wireScreen();
}

function renderHome(){
  return `
  <div class="screen">
    <a href="index.html" class="back-link">&larr; Duel</a>
    <div class="brand">
      <span class="kicker">Two Players · Same Board</span>
      <h1>Speed<br><span class="vs">Boggle</span> Duel</h1>
    </div>
    <div class="card">
      <label>Your name</label>
      <input type="text" id="nameInput" placeholder="e.g. Phil" maxlength="20" value="${Duel.getSavedName()}">
      <div class="btn-row" style="margin-top:22px;">
        <button class="btn btn-primary" id="createBtn">Start a room</button>
      </div>
    </div>
    <div class="card">
      <label>Have a room code?</label>
      <input type="text" id="joinCode" placeholder="4-letter code" maxlength="4" style="text-transform:uppercase;">
      <div class="btn-row">
        <button class="btn btn-ghost" id="joinBtn">Join room</button>
      </div>
    </div>
    <div class="card center">
      <button class="btn btn-ghost" id="soloBtn" style="width:100%;">Practice Solo</button>
    </div>
  </div>`;
}

function renderLobby(){
  const room = state.room;
  const bothIn = state.localMode ? true : (room && room.p1 && room.p2);
  return `
  <div class="screen">
    <button class="stop-btn" id="stopBtn">Stop</button>
    <div class="brand" style="margin-bottom:14px;">
      <span class="kicker">${state.localMode ? 'Solo Practice' : 'Room Code'}</span>
      <div class="code-display">${state.localMode ? 'LOCAL' : state.roomId}</div>
    </div>
    <div class="card center">
      <div class="muted" style="margin-bottom:10px;">${state.localMode ? room.p1.name + ' (practice round — no opponent)' : (room?.p1?.name || '...') + ' vs ' + (room?.p2?.name || 'waiting for opponent')}</div>
      ${bothIn
        ? `<button class="btn btn-primary" id="startBtn" style="width:100%;">Start Round</button>`
        : `<div class="spinner" style="margin:0 auto;"></div><div class="muted" style="margin-top:10px;">Waiting for the other player to join...</div>`
      }
    </div>
    ${bothIn && state.playerId==='p1' ? `
    <div class="card">
      <label>Round length</label>
      <input type="number" id="durationInput" value="${room.durationSeconds || ROUND_SECONDS_DEFAULT}" min="30" max="300" step="15">
    </div>` : ''}
  </div>`;
}

function renderCountdown(){
  const n = state.room?.countdownValue ?? 3;
  return `
  <div class="screen center" style="justify-content:center; align-items:center; position:relative;">
    <button class="stop-btn" id="stopBtn" style="position:absolute; top:20px; left:20px;">Stop</button>
    <div style="font-family:'Fraunces'; font-size:96px; font-weight:700; color:var(--brass-bright);">${n > 0 ? n : 'GO'}</div>
    <div class="muted">Get ready to trace...</div>
  </div>`;
}

function renderPlaying(){
  const board = state.room.board;
  const n = state.boardSize;
  const oppKey = state.playerId === 'p1' ? 'p2' : 'p1';
  const oppCount = (state.room[oppKey]?.words || []).length;
  return `
  <div class="screen">
    <button class="stop-btn" id="stopBtn">Stop</button>
    <div class="topbar">
      <div class="timer-ring" id="timerRing">
        <svg viewBox="0 0 58 58"><circle class="bg" cx="29" cy="29" r="25"></circle><circle class="fg" id="timerCircle" cx="29" cy="29" r="25" stroke-dasharray="157" stroke-dashoffset="0"></circle></svg>
        <div class="timer-num" id="timerNum">--</div>
      </div>
      ${state.localMode ? '' : `
      <div class="opp-status">
        <div class="name">${state.room[oppKey]?.name || 'Opponent'}</div>
        <div class="count" id="oppCount">${oppCount} found</div>
      </div>`}
    </div>
    <div class="tray" id="tray">
      <div class="current" id="currentWord">&nbsp;</div>
      <div class="found-count" id="myCount">${state.foundWords.size} found · ${state.score} pts</div>
    </div>
    <div class="board-wrap">
      <div class="board" id="board" style="grid-template-columns:repeat(${n},1fr);">
        <svg class="path-svg" id="pathSvg" viewBox="0 0 400 400"><path id="pathLine" d=""></path></svg>
        ${board.map((t,i)=>`<div class="tile" data-i="${i}" style="animation-delay:${(i%n + Math.floor(i/n))*35}ms;">${t==='QU' ? 'Q<span class="qu-sub">u</span>' : t}</div>`).join('')}
      </div>
    </div>
  </div>`;
}

function renderScoring(){
  return `
  <div class="screen center" style="justify-content:center; align-items:center;">
    <div class="spinner" style="width:28px;height:28px;"></div>
    <div class="muted" style="margin-top:14px;">Checking words against the dictionary...</div>
  </div>`;
}

function renderResults(){
  const r = state.room.results;
  if(!r) return renderScoring();

  if(state.localMode){
    return `
    <div class="screen">
      <a href="index.html" class="back-link">&larr; Duel</a>
      <div class="winner-banner">
        <h2>Practice round complete</h2>
      </div>
      <div class="card result-col">
        <h3>${state.room.p1.name}</h3>
        <div class="score">${r.p1.score} pts</div>
        ${r.p1.words.map(w=>`<div class="wordline"><span>${w.word.toLowerCase()}</span><span class="pt">+${w.points}</span></div>`).join('') || '<div class="muted">No valid words found</div>'}
      </div>
      ${r.invalid.length ? `
      <div class="card">
        <div class="removed-list"><strong>Not real words (removed):</strong> ${r.invalid.join(', ').toLowerCase()}</div>
      </div>` : ''}
      <div class="btn-row">
        <button class="btn btn-primary" id="rematchBtn" style="width:100%;">Practice Again</button>
      </div>
    </div>`;
  }

  const myKey = state.playerId;
  const oppKey = state.playerId === 'p1' ? 'p2' : 'p1';
  const me = r[myKey], opp = r[oppKey];
  const winner = me.score > opp.score ? state.room[myKey].name
               : opp.score > me.score ? state.room[oppKey].name
               : null;
  return `
  <div class="screen">
    <a href="index.html" class="back-link">&larr; Duel</a>
    <div class="winner-banner">
      <h2>${winner ? winner + ' wins the round!' : "It's a tie!"}</h2>
    </div>
    <div class="result-grid">
      <div class="card result-col">
        <h3>${state.room[myKey].name} (you)</h3>
        <div class="score">${me.score} pts</div>
        ${me.words.map(w=>`<div class="wordline"><span>${w.word.toLowerCase()}</span><span class="pt">+${w.points}</span></div>`).join('') || '<div class="muted">No unique words</div>'}
      </div>
      <div class="card result-col">
        <h3>${state.room[oppKey].name}</h3>
        <div class="score">${opp.score} pts</div>
        ${opp.words.map(w=>`<div class="wordline"><span>${w.word.toLowerCase()}</span><span class="pt">+${w.points}</span></div>`).join('') || '<div class="muted">No unique words</div>'}
      </div>
    </div>
    ${r.shared.length || r.invalid.length ? `
    <div class="card">
      ${r.shared.length ? `<div class="removed-list"><strong>Both found (cancelled out):</strong> ${r.shared.join(', ').toLowerCase()}</div>` : ''}
      ${r.invalid.length ? `<div class="removed-list"><strong>Not real words (removed):</strong> ${r.invalid.join(', ').toLowerCase()}</div>` : ''}
    </div>` : ''}
    <div class="btn-row">
      <button class="btn btn-primary" id="rematchBtn" style="width:100%;">Play Again</button>
    </div>
  </div>`;
}

/* ============================================================
   WIRE UP EVENTS FOR WHATEVER SCREEN IS CURRENTLY RENDERED
   ============================================================ */
function wireScreen(){
  const stopBtn = document.getElementById('stopBtn');
  if(stopBtn) stopBtn.onclick = stopGame;

  if(state.screen === 'home'){
    document.getElementById('createBtn').onclick = createRoom;
    document.getElementById('joinBtn').onclick = joinRoom;
    document.getElementById('soloBtn').onclick = startLocalPractice;
  }
  if(state.screen === 'lobby'){
    const startBtn = document.getElementById('startBtn');
    if(startBtn) startBtn.onclick = beginCountdown;
  }
  if(state.screen === 'playing'){
    wireBoardInput();
    startLocalTimerTick();
  }
  if(state.screen === 'results'){
    const rb = document.getElementById('rematchBtn');
    if(rb) rb.onclick = requestRematch;
  }
}

/* ============================================================
   ROOM / LOBBY LOGIC
   ============================================================ */
function createRoom(){
  const name = document.getElementById('nameInput').value.trim() || 'Player 1';
  Duel.saveName(name);
  Duel.createRoom('boggleRooms', name, { words: [] }, { durationSeconds: ROUND_SECONDS_DEFAULT })
    .then(id=>{
      state.roomId = id;
      state.playerId = 'p1';
      state.playerName = name;
      subscribeToRoom(id);
    });
}

function joinRoom(){
  const name = document.getElementById('nameInput').value.trim() || 'Player 2';
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  if(!code){ toast('Enter a room code first'); return; }
  Duel.saveName(name);
  Duel.joinRoom('boggleRooms', code, name, { words: [] }).then(result=>{
    if(!result.ok){
      toast(result.reason === 'full' ? 'That room is already full' : 'No room with that code');
      return;
    }
    state.roomId = code;
    state.playerId = 'p2';
    state.playerName = name;
    subscribeToRoom(code);
  });
}

function startLocalPractice(){
  const name = document.getElementById('nameInput').value.trim() || 'You';
  Duel.saveName(name);
  state.localMode = true;
  state.roomId = 'LOCAL';
  state.playerId = 'p1';
  state.playerName = name;
  state.room = { status:'lobby', p1:{ name, words:[] }, p2:null, durationSeconds: ROUND_SECONDS_DEFAULT };
  state.screen = 'lobby';
  render();
}

function subscribeToRoom(id){
  if(state.unsub) state.unsub();
  state.unsub = Duel.subscribeRoom('boggleRooms', id, data=>{
    const prevStatus = state.room?.status;
    state.room = data;

    if(data.status === 'lobby') state.screen = 'lobby';
    else if(data.status === 'countdown') state.screen = 'countdown';
    else if(data.status === 'playing'){
      if(prevStatus !== 'playing'){
        state.foundWords = new Set();
        state.score = 0;
        state.roundEndsAt = data.startedAt ? data.startedAt.toMillis() + data.durationSeconds*1000 : null;
      }
      state.screen = 'playing';
    }
    else if(data.status === 'scoring'){
      state.screen = 'scoring';
      // Only one client should run the scoring pass — p1 does it.
      if(state.playerId === 'p1' && !state.scoringDone){
        state.scoringDone = true;
        runScoring(id, data);
      }
    }
    else if(data.status === 'results') state.screen = 'results';

    render();
  });
}

function beginCountdown(){
  const durInput = document.getElementById('durationInput');
  const duration = durInput ? parseInt(durInput.value,10) : (state.room.durationSeconds || ROUND_SECONDS_DEFAULT);
  const board = rollBoard();

  if(state.localMode){
    state.room = { ...state.room, status:'countdown', board, durationSeconds: duration || ROUND_SECONDS_DEFAULT, countdownValue: 3, p1:{ ...state.room.p1, words:[] } };
    state.screen = 'countdown';
    render();
    let n = 3;
    const iv = setInterval(()=>{
      n -= 1;
      if(n >= 0){
        state.room = { ...state.room, countdownValue: n };
        render();
      } else {
        clearInterval(iv);
        state.foundWords = new Set();
        state.score = 0;
        state.room = { ...state.room, status:'playing', startedAt: null };
        state.roundEndsAt = Date.now() + state.room.durationSeconds*1000;
        state.screen = 'playing';
        render();
      }
    }, 800);
    return;
  }

  const ref = db.collection('boggleRooms').doc(state.roomId);
  ref.update({
    status: 'countdown',
    board,
    durationSeconds: duration || ROUND_SECONDS_DEFAULT,
    countdownValue: 3,
    'p1.words': [],
    'p2.words': []
  }).then(()=>{
    // p1's device drives the countdown ticks so both clients see the same numbers
    let n = 3;
    const iv = setInterval(()=>{
      n -= 1;
      if(n >= 0){
        ref.update({ countdownValue: n });
      } else {
        clearInterval(iv);
        ref.update({ status:'playing', startedAt: firebase.firestore.FieldValue.serverTimestamp() });
      }
    }, 800);
  });
}

function stopGame(){
  if(state.unsub) state.unsub();
  if(state.timerInterval) clearInterval(state.timerInterval);
  state.localMode = false;
  state.roomId = null;
  state.playerId = null;
  state.room = null;
  state.foundWords = new Set();
  state.score = 0;
  state.scoringDone = false;
  state.screen = 'home';
  render();
}

function requestRematch(){
  if(state.localMode){
    state.room = { status:'lobby', p1:{ name: state.room.p1.name, words:[] }, p2:null, durationSeconds: state.room.durationSeconds || ROUND_SECONDS_DEFAULT };
    state.screen = 'lobby';
    state.scoringDone = false;
    render();
    return;
  }
  const ref = db.collection('boggleRooms').doc(state.roomId);
  ref.update({ status:'lobby', results: firebase.firestore.FieldValue.delete() });
  state.scoringDone = false;
}

/* ============================================================
   BOARD INPUT — drag to trace a path, adjacency-checked
   ============================================================ */
function neighbors(i, n){
  const r = Math.floor(i/n), c = i%n;
  const out = [];
  for(let dr=-1; dr<=1; dr++) for(let dc=-1; dc<=1; dc++){
    if(dr===0 && dc===0) continue;
    const rr=r+dr, cc=c+dc;
    if(rr>=0 && rr<n && cc>=0 && cc<n) out.push(rr*n+cc);
  }
  return out;
}

function wireBoardInput(){
  const boardEl = document.getElementById('board');
  const n = state.boardSize;
  let tiles = Array.from(boardEl.querySelectorAll('.tile'));

  function tileAtPoint(x,y){
    const el = document.elementFromPoint(x,y);
    if(!el) return null;
    const tileEl = el.closest('.tile');
    return tileEl ? parseInt(tileEl.dataset.i,10) : null;
  }

  function startPath(i){
    state.currentPath = [i];
    updateSelectionUI();
  }
  function extendPath(i){
    if(i==null) return;
    const last = state.currentPath[state.currentPath.length-1];
    if(i === last) return;
    if(state.currentPath.includes(i)) return;
    if(!neighbors(last, n).includes(i)) return;
    state.currentPath.push(i);
    updateSelectionUI();
  }
  function endPath(){
    submitCurrentWord();
    state.currentPath = [];
    updateSelectionUI();
  }

  function updateSelectionUI(){
    tiles.forEach(t=>t.classList.remove('selected'));
    let word = '';
    const board = state.room.board;
    state.currentPath.forEach(i=>{
      tiles[i].classList.add('selected');
      word += board[i];
    });
    document.getElementById('currentWord').textContent = word || '\u00A0';
    drawPathLine();
  }

  function drawPathLine(){
    const svg = document.getElementById('pathSvg');
    const line = document.getElementById('pathLine');
    if(state.currentPath.length < 2){ line.setAttribute('d',''); return; }
    const rect = boardEl.getBoundingClientRect();
    const pts = state.currentPath.map(i=>{
      const el = tiles[i];
      const tr = el.getBoundingClientRect();
      const x = ((tr.left + tr.width/2) - rect.left) / rect.width * 400;
      const y = ((tr.top + tr.height/2) - rect.top) / rect.height * 400;
      return [x,y];
    });
    const d = 'M ' + pts.map(p=>p.join(',')).join(' L ');
    line.setAttribute('d', d);
  }

  boardEl.addEventListener('pointerdown', e=>{
    state.dragging = true;
    const i = tileAtPoint(e.clientX, e.clientY);
    if(i!=null) startPath(i);
  });
  boardEl.addEventListener('pointermove', e=>{
    if(!state.dragging) return;
    const i = tileAtPoint(e.clientX, e.clientY);
    if(i!=null) extendPath(i);
  });
  window.addEventListener('pointerup', ()=>{
    if(!state.dragging) return;
    state.dragging = false;
    endPath();
  });
}

async function submitCurrentWord(){
  const board = state.room.board;
  const word = state.currentPath.map(i=>board[i]).join('');
  const tray = document.getElementById('tray');
  const countEl = document.getElementById('myCount');

  function flashBad(msg){
    tray.classList.add('flash-bad'); setTimeout(()=>tray.classList.remove('flash-bad'),400);
    if(msg) toast(msg);
  }
  function updateCount(){
    countEl.textContent = state.foundWords.size + ' found · ' + state.score + ' pts';
  }
  function accept(){
    const pts = scoreForLength(word.length);
    state.score += pts;
    updateCount();
    tray.classList.add('flash-good'); setTimeout(()=>tray.classList.remove('flash-good'),400);
    popScore(pts, tray);
    saveFoundWord(word);
  }

  if(state.currentPath.length < MIN_WORD_LEN || word.length < MIN_WORD_LEN){
    if(state.currentPath.length > 0) flashBad();
    return;
  }
  if(state.foundWords.has(word)){
    flashBad('Already found that one');
    return;
  }

  // Fast path: in the local word list, so this resolves with zero
  // network calls and no waiting at all.
  if(Duel.isInLocalList(word)){
    state.foundWords.add(word);
    accept();
    return;
  }

  // Slow path: not in the local list, so we ask the dictionary API.
  // This should be the exception rather than the rule during normal play.
  state.foundWords.add(word); // reserve so a fast re-trace isn't double counted
  countEl.textContent = state.foundWords.size + ' found · ' + state.score + ' pts (checking ' + word.toLowerCase() + '...)';
  const ok = await Duel.isRealWord(word);

  if(!ok){
    state.foundWords.delete(word);
    updateCount();
    flashBad(word.toLowerCase() + " isn't a real word");
    return;
  }
  accept();
}

function saveFoundWord(word){
  if(state.localMode){
    if(!state.room.p1.words) state.room.p1.words = [];
    state.room.p1.words.push(word);
    return;
  }
  const ref = db.collection('boggleRooms').doc(state.roomId);
  ref.update({ [`${state.playerId}.words`]: firebase.firestore.FieldValue.arrayUnion(word) });
}

function popScore(points, anchorEl){
  const pop = document.createElement('div');
  pop.className = 'score-pop';
  pop.textContent = '+' + points;
  anchorEl.appendChild(pop);
  setTimeout(()=>pop.remove(), 700);
}

/* ============================================================
   TIMER — purely visual/local, derived from the shared startedAt
   so both phones count down in sync regardless of small clock drift
   ============================================================ */
function startLocalTimerTick(){
  if(state.timerInterval) clearInterval(state.timerInterval);
  const ring = document.getElementById('timerCircle');
  const num = document.getElementById('timerNum');
  const circumference = 157; // 2*pi*25, matches the SVG circle radius
  const duration = state.room.durationSeconds || ROUND_SECONDS_DEFAULT;

  state.timerInterval = setInterval(()=>{
    if(!state.roundEndsAt){ return; }
    const remainingMs = state.roundEndsAt - Date.now();
    const remaining = Math.max(0, Math.ceil(remainingMs/1000));
    if(num) num.textContent = remaining;
    if(ring){
      const frac = Math.max(0, remainingMs / (duration*1000));
      ring.setAttribute('stroke-dashoffset', String(circumference * (1-frac)));
      ring.parentElement.parentElement.classList.toggle('urgent', remaining <= 15);
    }
    if(remainingMs <= 0){
      clearInterval(state.timerInterval);
      if(state.localMode){
        state.room.status = 'scoring';
        state.screen = 'scoring';
        render();
        runScoringLocal();
      } else if(state.playerId === 'p1'){
        db.collection('boggleRooms').doc(state.roomId).update({ status:'scoring' });
      }
    }
  }, 200);
}

/* ============================================================
   SCORING — runs once, on p1's device, when the round ends
   1. Cancel out words both players found (real Boggle rule)
   2. Score what's left by word length
   Dictionary validation already happened live, per word, at the moment
   each one was traced — see submitCurrentWord — so nothing here needs
   the network, and this step is now instant.
   ============================================================ */

async function runScoring(roomId, data){
  const p1Words = [...new Set(data.p1.words || [])];
  const p2Words = [...new Set(data.p2.words || [])];
  const shared = p1Words.filter(w=>p2Words.includes(w));
  const p1Only = p1Words.filter(w=>!shared.includes(w));
  const p2Only = p2Words.filter(w=>!shared.includes(w));

  const build = (list)=> list.map(w=>({ word:w, points: scoreForLength(w.length) }))
                              .sort((a,b)=> b.points - a.points);
  const p1res = build(p1Only);
  const p2res = build(p2Only);

  const results = {
    p1: { words: p1res, score: p1res.reduce((s,x)=>s+x.points,0) },
    p2: { words: p2res, score: p2res.reduce((s,x)=>s+x.points,0) },
    shared, invalid: []
  };

  await db.collection('boggleRooms').doc(roomId).update({ status:'results', results });
}

/* Solo-practice version of scoring — words are already validated live
   during play, so this is just tallying points, no network needed. */
function runScoringLocal(){
  const p1Words = [...new Set(state.room.p1.words || [])];
  const build = (list)=> list.map(w=>({ word:w, points: scoreForLength(w.length) }))
                              .sort((a,b)=> b.points - a.points);
  const p1res = build(p1Words);

  state.room.results = {
    p1: { words: p1res, score: p1res.reduce((s,x)=>s+x.points,0) },
    p2: { words: [], score: 0 },
    shared: [], invalid: []
  };
  state.room.status = 'results';
  state.screen = 'results';
  render();
}

render();
</script>
