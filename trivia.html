<style>
  /* Same felt/ivory/brass identity as the rest of Duel */
  :root{
    --felt: #123524; --felt-deep:#0c2419; --felt-light:#1d4a34;
    --ivory: #f4ecd8; --ivory-dim: #e3d7b4; --ink: #22201c;
    --brass: #c9a227; --brass-bright: #e6c04f; --brass-dark: #8f6f16;
    --alert: #c1440e; --success: #7a9b5c;
    --line: rgba(244,236,216,0.14);
    --shadow-hard: 0 6px 0 rgba(0,0,0,0.35);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    height:100%; margin:0; overscroll-behavior:none;
    background: radial-gradient(120% 140% at 50% -10%, var(--felt-light), var(--felt) 55%, var(--felt-deep) 100%);
    color:var(--ivory); font-family:'Work Sans', sans-serif; -webkit-user-select:none; user-select:none;
  }
  #app{ min-height:100dvh; display:flex; flex-direction:column; padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)); }
  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:700; margin:0; letter-spacing:-0.01em; }
  .screen{ flex:1; display:flex; flex-direction:column; animation: fadein .35s ease both; min-height:0; }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .brand{ text-align:center; margin: 10px 0 28px; }
  .back-link{ display:inline-block; font-size:13px; color:var(--ivory-dim); text-decoration:none; margin-bottom:4px; }
  .back-link:active{ color:var(--brass-bright); }
  .brand .kicker{ display:block; font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--brass-bright); opacity:.85; margin-bottom:6px; }
  .brand h1{ font-size:38px; line-height:1; }

  label{ font-size:12px; text-transform:uppercase; letter-spacing:.12em; color:var(--ivory-dim); display:block; margin: 18px 0 8px; }
  input[type=text]{
    width:100%; padding:14px 16px; font-size:18px; font-family:'Work Sans';
    background:var(--felt-light); border:1px solid var(--line); border-radius:10px;
    color:var(--ivory); outline:none;
  }
  input:focus{ border-color:var(--brass); }

  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:15px 20px; border-radius:12px; border:none; cursor:pointer;
    font-family:'Work Sans'; font-weight:600; font-size:16px;
    transition: transform .08s ease;
  }
  .btn:active{ transform: translateY(2px); }
  .btn-primary{ background:var(--brass); color:#241c02; box-shadow:var(--shadow-hard); }
  .btn-primary:active{ box-shadow:0 3px 0 rgba(0,0,0,.35); }
  .btn-ghost{ background:transparent; color:var(--ivory-dim); border:1px solid var(--line); }
  .btn-row{ display:flex; gap:10px; margin-top:22px; }
  .btn-row .btn{ flex:1; }

  .card{ background:rgba(0,0,0,0.16); border:1px solid var(--line); border-radius:16px; padding:20px; margin-top:16px; }
  .muted{ color:var(--ivory-dim); font-size:14px; line-height:1.5; }
  .center{ text-align:center; }

  .code-display{
    font-family:'Fraunces'; font-weight:700; font-size:34px; letter-spacing:.12em;
    text-align:center; padding:16px; background:rgba(0,0,0,0.2); border-radius:12px;
    border:1px dashed var(--brass); color:var(--brass-bright); margin-top:10px;
  }
  .spinner{ width:16px; height:16px; border-radius:50%; border:2px solid rgba(244,236,216,.25); border-top-color:var(--brass-bright); animation:spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .tier-row{ display:flex; gap:8px; margin-top:8px; }
  .tier-btn{
    flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:transparent;
    color:var(--ivory-dim); font-family:'Work Sans'; font-weight:600; font-size:13px; cursor:pointer;
  }
  .tier-btn.active{ background:var(--brass); color:#241c02; border-color:var(--brass); }

  /* ---- score header ---- */
  .score-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .score-side{ text-align:center; }
  .score-side .name{ font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--ivory-dim); }
  .score-side .num{ font-family:'Fraunces'; font-weight:700; font-size:26px; color:var(--brass-bright); }
  .score-vs{ font-size:12px; color:var(--ivory-dim); }
  .round-tag{ text-align:center; font-size:12px; color:var(--ivory-dim); text-transform:uppercase; letter-spacing:.12em; margin-bottom:6px; }

  /* ---- question card ---- */
  .q-progress{ display:flex; gap:5px; justify-content:center; margin-bottom:14px; }
  .q-dot{ width:8px; height:8px; border-radius:50%; background:rgba(244,236,216,.2); }
  .q-dot.done{ background:var(--brass-bright); }
  .q-dot.current{ background:var(--ivory); }
  .q-category{ text-align:center; font-size:12px; color:var(--brass-bright); text-transform:uppercase; letter-spacing:.14em; margin-bottom:8px; }
  .q-text{ font-family:'Fraunces'; font-weight:700; font-size:22px; text-align:center; margin-bottom:22px; line-height:1.3; }
  .opt-btn{
    width:100%; text-align:left; padding:14px 16px; margin-bottom:10px; border-radius:12px;

  .opt-btn.wrong{ background:rgba(193,68,14,.4); border-color:var(--alert); }
  .opt-btn.reveal-correct{ background:rgba(122,155,92,.3); border-color:var(--success); }
  .opt-btn:disabled{ pointer-events:none; opacity:.9; }

  .reveal-item{ background:rgba(0,0,0,.16); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; }
  .reveal-q{ font-size:14px; font-weight:600; margin-bottom:8px; }

  }
  .toast.show{ transform:translateY(0); }
  .hidden{ display:none !important; }

const ROUND_SIZE = 5;
const TOTAL_ROUNDS_OPTIONS = { short:3, medium:5, long:8 };

function shuffledIndices(n){
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function buildRounds(totalRounds){
  const need = totalRounds * ROUND_SIZE;
  const pool = shuffledIndices(QUESTIONS.length).slice(0, Math.min(need, QUESTIONS.length));
  const rounds = [];
  for(let r=0; r<totalRounds; r++){
    const ids = [];
    for(let i=0;i<ROUND_SIZE;i++){
      ids.push(pool[(r*ROUND_SIZE + i) % pool.length]);
    }
    rounds.push({
      questionIds: ids,
      p1: { answers:[], done:false, score:0 },
      p2: { answers:[], done:false, score:0 }
    });
  }
  return rounds;
}

  selectedTier: null,
  localAnswers: [],   // answers given so far in the round currently being played
  localQIndex: 0,     // which question within the round is showing
  lockedChoice: null, // the option index just tapped, while showing feedback

function render(){
  const app = document.getElementById('app');
  if(state.screen === 'home') app.innerHTML = renderHome();
  else if(state.screen === 'lobby') app.innerHTML = renderLobby();
  else if(state.screen === 'playing') app.innerHTML = renderPlaying();
  else if(state.screen === 'finished') app.innerHTML = renderFinished();
  wireScreen();
}

    </div>
    <div class="card center">
      <div class="muted" style="margin-bottom:10px;">${state.localMode ? room.p1.name + ' (practice — no opponent)' : (room?.p1?.name || '...') + ' vs ' + (room?.p2?.name || 'waiting for opponent')}</div>
      ${bothIn
        ? `<button class="btn btn-primary" id="startBtn" style="width:100%;">Start Round</button>`
        : `<div class="spinner" style="margin:0 auto;"></div><div class="muted" style="margin-top:10px;">Waiting for the other player to join...</div>`
      }
    </div>
    ${bothIn && (state.playerId==='p1' || state.localMode) ? `
    <div class="card">
      <label>Game length</label>
      <div class="tier-row" id="tierRow">
        <button class="tier-btn ${tier==='short'?'active':''}" data-tier="short">Short (3 rounds)</button>
        <button class="tier-btn ${tier==='medium'?'active':''}" data-tier="medium">Medium (5)</button>
        <button class="tier-btn ${tier==='long'?'active':''}" data-tier="long">Long (8)</button>
      </div>
      <div class="muted" style="margin-top:10px;">Each round is ${ROUND_SIZE} questions. You each answer independently, whenever you get to it — no need to be online at the same time.</div>
    </div>` : ''}
  </div>`;
}

function totalScoreSoFar(room, key){
  return (room.rounds||[]).reduce((sum,r)=> r[key].done ? sum + r[key].score : sum, 0);
}

/* Which state is the current round in, for me? */
function getRoundView(){
  const room = state.room;
  const round = room.rounds[room.currentRoundIndex];
  const me = round[state.playerId];
  const oppKey = state.playerId === 'p1' ? 'p2' : 'p1';
  const opp = round[oppKey];
  if(!me.done) return 'answering';
  if(!state.localMode && !opp.done) return 'waiting';
  return 'reveal';
}

function renderPlaying(){
  const room = state.room;
  const view = getRoundView();
  const oppKey = state.playerId === 'p1' ? 'p2' : 'p1';

  if(view === 'answering') return renderAnswering();
  if(view === 'waiting') return renderWaiting();
  return renderReveal();
}

function renderScoreHeader(){
  const room = state.room;
  const oppKey = state.playerId === 'p1' ? 'p2' : 'p1';
  const myTotal = totalScoreSoFar(room, state.playerId);
  const oppTotal = state.localMode ? null : totalScoreSoFar(room, oppKey);
  return `
    <div class="round-tag">Round ${room.currentRoundIndex+1} of ${room.rounds.length}</div>
    <div class="score-row">
      <div class="score-side"><div class="name">${room[state.playerId].name} (you)</div><div class="num">${myTotal}</div></div>
      ${!state.localMode ? `<div class="score-vs">vs</div><div class="score-side"><div class="name">${room[oppKey].name}</div><div class="num">${oppTotal}</div></div>` : ''}
    </div>`;
}

function renderAnswering(){
  const room = state.room;
  const round = room.rounds[room.currentRoundIndex];
  const qId = round.questionIds[state.localQIndex];
  const question = QUESTIONS[qId];
  const showingFeedback = state.lockedChoice !== null;

  return `
  <div class="screen">
    ${renderScoreHeader()}
    <div class="q-progress">
      ${round.questionIds.map((_,i)=>`<div class="q-dot ${i<state.localQIndex?'done':(i===state.localQIndex?'current':'')}"></div>`).join('')}
    </div>
    <div class="q-category">${question.c}</div>
    <div class="q-text">${question.q}</div>
    ${question.o.map((opt,i)=>{
      let cls = 'opt-btn';
      if(showingFeedback){
        if(i === question.a) cls += ' correct';
        else if(i === state.lockedChoice) cls += ' wrong';
      }
      return `<button class="${cls}" data-i="${i}" ${showingFeedback?'disabled':''}>${opt}</button>`;
    }).join('')}
  </div>`;
}

function renderWaiting(){
  const room = state.room;
  const oppKey = state.playerId === 'p1' ? 'p2' : 'p1';
  return `
  <div class="screen center" style="justify-content:center;">
    ${renderScoreHeader()}
    <div class="spinner" style="margin:20px auto 0;"></div>
    <h2 style="margin-top:16px;">Waiting on ${room[oppKey].name}...</h2>
    <div class="muted" style="margin-top:8px;">You've finished this round — check back anytime to see the reveal once they're done.</div>
  </div>`;
}

function renderReveal(){
  const room = state.room;
  const round = room.rounds[room.currentRoundIndex];
  const oppKey = state.playerId === 'p1' ? 'p2' : 'p1';
  const me = round[state.playerId];
  const opp = round[oppKey];
  const isLastRound = room.currentRoundIndex >= room.rounds.length - 1;

  const items = round.questionIds.map((qId, i)=>{
    const question = QUESTIONS[qId];
    const myAns = me.answers[i];
    const oppAns = !state.localMode ? opp.answers[i] : null;
    return `
    <div class="reveal-item">
      <div class="reveal-q">${question.q}</div>
      <div class="reveal-answers">
        <div class="${myAns===question.a?'ok':'bad'}">You: ${question.o[myAns]}</div>
        ${!state.localMode ? `<div class="${oppAns===question.a?'ok':'bad'}">${room[oppKey].name}: ${question.o[oppAns]}</div>` : ''}
        <div class="who">Correct answer: ${question.o[question.a]}</div>
      </div>
    </div>`;
  }).join('');

  return `
  <div class="screen">
    ${renderScoreHeader()}
    <div class="muted center" style="margin-bottom:12px;">This round: you scored ${me.score}/${ROUND_SIZE}${!state.localMode ? ` · ${room[oppKey].name} scored ${opp.score}/${ROUND_SIZE}` : ''}</div>
    ${items}
    <div class="btn-row">
      <button class="btn btn-primary" id="nextRoundBtn" style="width:100%;">${isLastRound ? 'See Final Results' : 'Next Round'}</button>
    </div>
  </div>`;
}

function renderFinished(){
  const room = state.room;
  const oppKey = state.playerId === 'p1' ? 'p2' : 'p1';
  const myTotal = totalScoreSoFar(room, state.playerId);
  const oppTotal = state.localMode ? null : totalScoreSoFar(room, oppKey);
  const maxScore = room.rounds.length * ROUND_SIZE;

  let headline;
  if(state.localMode) headline = `You scored ${myTotal}/${maxScore}`;
  else if(myTotal > oppTotal) headline = 'You win!';
  else if(oppTotal > myTotal) headline = `${room[oppKey].name} wins!`;
  else headline = "It's a tie!";

  return `
  <div class="screen">
    <a href="index.html" class="back-link">&larr; Duel</a>
    <div class="winner-banner"><h2>${headline}</h2></div>
    <div class="score-row">
      <div class="score-side"><div class="name">${room[state.playerId].name} (you)</div><div class="num">${myTotal}</div></div>
      ${!state.localMode ? `<div class="score-vs">vs</div><div class="score-side"><div class="name">${room[oppKey].name}</div><div class="num">${oppTotal}</div></div>` : ''}
    </div>
    <div class="muted center" style="margin-top:10px;">Out of ${maxScore} possible points across ${room.rounds.length} rounds</div>
    <div class="btn-row">
      <button class="btn btn-primary" id="rematchBtn" style="width:100%;">Play Again</button>
    </div>
  </div>`;
}

/* ============================================================
   WIRE EVENTS
   ============================================================ */
function wireScreen(){
  if(state.screen === 'home'){
    document.getElementById('createBtn').onclick = createRoom;
    document.getElementById('joinBtn').onclick = joinRoom;
    document.getElementById('soloBtn').onclick = startLocalPractice;
  }
  if(state.screen === 'lobby'){
    const startBtn = document.getElementById('startBtn');
    if(startBtn) startBtn.onclick = beginGame;
    const tierRow = document.getElementById('tierRow');
    if(tierRow){
      tierRow.querySelectorAll('.tier-btn').forEach(btn=>{
        btn.onclick = ()=>{
          tierRow.querySelectorAll('.tier-btn').forEach(b=>b.classList.remove('active'));
          btn.classList.add('active');
          state.selectedTier = btn.dataset.tier;
        };
      });
    }
  }
  if(state.screen === 'playing'){
    const view = getRoundView();
    if(view === 'answering'){
      document.querySelectorAll('.opt-btn').forEach(btn=>{
        btn.onclick = ()=> handleAnswerTap(parseInt(btn.dataset.i,10));
      });
    }
    if(view === 'reveal'){
      const nb = document.getElementById('nextRoundBtn');
      if(nb) nb.onclick = advanceRound;
    }
  }
  if(state.screen === 'finished'){
    const rb = document.getElementById('rematchBtn');
    if(rb) rb.onclick = requestRematch;
  }
}

/* ============================================================
   ROOM / LOBBY LOGIC
   ============================================================ */
function createRoom(){
  const name = document.getElementById('nameInput').value.trim() || 'Player 1';
  Duel.saveName(name);
  Duel.createRoom('triviaRooms', name, {}, { tier:'medium' })
    .then(id=>{
      state.roomId = id;
      state.playerId = 'p1';
      subscribeToRoom(id);
    });
}

function joinRoom(){
  const name = document.getElementById('nameInput').value.trim() || 'Player 2';
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  if(!code){ toast('Enter a room code first'); return; }
  Duel.saveName(name);
  Duel.joinRoom('triviaRooms', code, name, {}).then(result=>{
    if(!result.ok){
      toast(result.reason === 'full' ? 'That room is already full' : 'No room with that code');
      return;
    }
    state.roomId = code;
    state.playerId = 'p2';
    subscribeToRoom(code);
  });
}

function startLocalPractice(){
  const name = document.getElementById('nameInput').value.trim() || 'You';
  Duel.saveName(name);
  state.localMode = true;
  state.roomId = 'LOCAL';
  state.playerId = 'p1';
  state.room = { status:'lobby', p1:{ name }, p2:null, tier:'medium' };
  state.screen = 'lobby';
  render();
}

function resetLocalAnswerState(){
  state.localAnswers = [];
  state.localQIndex = 0;
  state.lockedChoice = null;
}

function subscribeToRoom(id){
  if(state.unsub) state.unsub();
  let prevRoundIndex = null;
  state.unsub = Duel.subscribeRoom('triviaRooms', id, data=>{
    state.room = data;
    if(data.currentRoundIndex !== prevRoundIndex){
      prevRoundIndex = data.currentRoundIndex;
      resetLocalAnswerState();
    }
    if(data.status === 'lobby') state.screen = 'lobby';
    else if(data.status === 'playing') state.screen = 'playing';
    else if(data.status === 'finished') state.screen = 'finished';
    render();
  });
}

function beginGame(){
  const tier = state.selectedTier || state.room.tier || 'medium';
  const totalRounds = TOTAL_ROUNDS_OPTIONS[tier] || TOTAL_ROUNDS_OPTIONS.medium;
  const rounds = buildRounds(totalRounds);
  resetLocalAnswerState();

  if(state.localMode){
    state.room = { ...state.room, status:'playing', tier, rounds, currentRoundIndex: 0 };
    state.screen = 'playing';
    render();
    return;
  }

  const ref = db.collection('triviaRooms').doc(state.roomId);
  ref.update({ status:'playing', tier, rounds, currentRoundIndex: 0 });
}

function requestRematch(){
  if(state.localMode){
    state.room = { status:'lobby', p1:{ name: state.room.p1.name }, p2:null, tier: state.room.tier };
    state.screen = 'lobby';
    render();
    return;
  }
  const ref = db.collection('triviaRooms').doc(state.roomId);
  ref.update({ status:'lobby' });
}

/* ============================================================
   ANSWERING A QUESTION
   ============================================================ */
function handleAnswerTap(choiceIndex){
  if(state.lockedChoice !== null) return; // already answered this one, waiting to advance
  state.lockedChoice = choiceIndex;
  render();

  setTimeout(()=>{
    state.localAnswers.push(choiceIndex);
    state.localQIndex += 1;
    state.lockedChoice = null;

    if(state.localQIndex >= ROUND_SIZE){
      submitRound();
    } else {
      render();
    }
  }, 900);
}

function submitRound(){
  const room = state.room;
  const round = room.rounds[room.currentRoundIndex];
  const score = state.localAnswers.reduce((sum, choice, i)=>{
    const qId = round.questionIds[i];
    return sum + (choice === QUESTIONS[qId].a ? 1 : 0);
  }, 0);
  const myResult = { answers: state.localAnswers.slice(), done: true, score };

  if(state.localMode){
    room.rounds[room.currentRoundIndex].p1 = myResult;
    render();
    return;
  }

  const ref = db.collection('triviaRooms').doc(state.roomId);
  const newRounds = room.rounds.map((r,i)=> i === room.currentRoundIndex ? { ...r, [state.playerId]: myResult } : r);
  ref.update({ rounds: newRounds });
}

function advanceRound(){
  const room = state.room;
  const isLastRound = room.currentRoundIndex >= room.rounds.length - 1;
  resetLocalAnswerState();

  if(state.localMode){
    if(isLastRound){
      state.room.status = 'finished';
      state.screen = 'finished';
    } else {
      state.room.currentRoundIndex += 1;
      state.screen = 'playing';
    }
    render();
    return;
  }

  const ref = db.collection('triviaRooms').doc(state.roomId);
  if(isLastRound){
    ref.update({ status:'finished' });
  } else {
    ref.update({ currentRoundIndex: room.currentRoundIndex + 1 });
  }
}

render();
</script>
